[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dr-datasets"
version = "0.1.0"
description = "Catalog + downloader for dimensionality-reduction (DR) benchmark embedding datasets."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.23",
]

[project.optional-dependencies]
download = [
    "requests",
    "tqdm",
    "h5py",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "torch",
    "torchvision",
    "gensim",
    "sentence-transformers",
]

[project.urls]
Homepage = "https://github.com/jjmmwon/dr-datasets"

[tool.setuptools.packages.find]
include = ["dr_datasets*"]
